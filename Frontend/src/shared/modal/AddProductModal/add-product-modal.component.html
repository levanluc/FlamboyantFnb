<div class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
  <form #productForm="ngForm" (ngSubmit)="onSubmit(productForm)">
    <div class="bg-white w-full max-w-screen-xl rounded shadow-lg p-6 overflow-y-auto max-h-screen">
      <div class="flex justify-between items-center border-b pb-3">
        <h2 class="text-xl font-semibold">Thêm hàng</h2>
        <button type="button" (click)="closeModal()" class="text-gray-500 hover:text-red-600">&times;</button>
      </div>

      <!-- Tabs -->
      <div class="flex space-x-4 border-b mt-4">
        <button type="button" class="border-b-2 border-green-500 text-green-600 px-2 py-1">Thông tin</button>
        <button type="button" class="px-2 py-1">Mô tả chi tiết</button>
      </div>

      <!-- Form -->
      <div class="grid grid-cols-2 gap-6 mt-6">
        <!-- Left Column -->
        <div class="space-y-4">
          <div>
            <label class="block text-sm">Mã hàng</label>
            <input name="productCode" [(ngModel)]="formData.productCode" class="w-full border rounded p-2" placeholder="Mã hàng tự động" />
          </div>
          <div>
            <label class="block text-sm">Mã vạch</label>
            <input name="barcode" [(ngModel)]="formData.barcode" class="w-full border rounded p-2" />
          </div>
          <div>
            <label class="block text-sm">Tên hàng</label>
            <input name="productName" [(ngModel)]="formData.productName" class="w-full border rounded p-2" required />
          </div>
          <div>
            <label class="block text-sm">Nhóm hàng</label>
            <select name="productGroup" [(ngModel)]="formData.productGroup" class="w-full border rounded p-2">
              <option>---Lựa chọn---</option>
            </select>
          </div>

          <!-- Images -->
          <div class="flex space-x-2">
            <div class="w-20 h-20 bg-gray-100 border rounded flex items-center justify-center text-gray-400">Ảnh</div>
          </div>
        </div>

        <!-- Right Column -->
        <div class="space-y-4">
          <div>
            <label class="block text-sm">Giá vốn</label>
            <input type="number" name="costPrice" [(ngModel)]="formData.costPrice" class="w-full border rounded p-2" value="0" />
          </div>
          <div>
            <label class="block text-sm">Giá bán trước thuế</label>
            <input type="number" name="sellingPriceBeforeTax" [(ngModel)]="formData.sellingPriceBeforeTax" class="w-full border rounded p-2" value="0" />
          </div>
          <div>
            <label class="block text-sm">Giá bán sau thuế</label>
            <input type="number" name="sellingPriceAfterTax" [(ngModel)]="formData.sellingPriceAfterTax" class="w-full border rounded p-2" value="0" />
          </div>
          <div>
            <label class="block text-sm">Tồn kho</label>
            <input type="number" name="inventory" [(ngModel)]="formData.inventory" class="w-full border rounded p-2" value="0" />
          </div>
        </div>
      </div>

      <!-- Expandable Sections -->
      <div class="mt-6 space-y-2">
        <button type="button" class="w-full text-left bg-gray-100 p-2 rounded">Đơn vị tính</button>
      </div>

      <!-- Buttons -->
      <div class="flex justify-end space-x-2 mt-6">
        <button type="submit" class="bg-green-600 text-white px-4 py-2 rounded disabled:opacity-75 disabled:cursor-not-allowed" [disabled]="productForm.invalid">Lưu</button>
        <button type="button" (click)="closeModal()" class="bg-gray-300 px-4 py-2 rounded">Bỏ qua</button>
      </div>
    </div>
  </form>
</div>
