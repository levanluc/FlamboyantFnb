<div class="fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center z-50">
    <form #groupForm="ngForm" (ngSubmit)="onSubmit(groupForm)" class="w-full max-w-md">
        <div class="bg-white rounded-xl shadow-2xl p-6 transform transition-all">
            <!-- Header -->
            <div class="flex justify-between items-center border-b pb-3">
                <h2 class="text-xl font-bold text-gray-800">Thêm nhóm hàng</h2>
                <button type="button" (click)="closeModal()"
                    class="text-gray-400 hover:text-red-500 transition-colors duration-200">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24"
                        stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>
            <!-- Form -->
            <div class="space-y-4 mt-4">
                <div>
                    <input name="groupName" [(ngModel)]="formData.groupName" required #groupName="ngModel"
                        class="w-full px-3 py-2 border-b border-gray-300 placeholder-gray-400 text-sm transition-all duration-200"
                        placeholder="Nhập tên nhóm" />
                    <div *ngIf="groupName.invalid && (groupName.dirty || groupName.touched)"
                        class="text-red-500 text-xs mt-1">
                        Tên nhóm là bắt buộc.
                    </div>
                </div>
            </div>
            <!-- Buttons -->
            <div class="flex justify-end space-x-3 mt-6">
                <button type="submit" [disabled]="groupForm.invalid"
                    class="px-4 py-2 bg-emerald-600 text-white rounded-lg hover:bg-emerald-700 transition-colors duration-200 disabled:opacity-50 disabled:cursor-not-allowed">
                    Thêm nhóm
                </button>
            </div>
        </div>
    </form>
</div>
