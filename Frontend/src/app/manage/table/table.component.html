<div class="p-4">
  <!-- Top Bar -->
  <div class="flex justify-between items-center rounded-lg mb-4">
    <!-- Title -->
    <div class="text-lg font-bold text-gray-700">
      Quản lý Phòng/Bàn
    </div>
    <!-- Actions -->
    <div class="flex gap-2">
      <button class="bg-emerald-600 text-white px-4 py-2 text-sm font-medium rounded-lg hover:bg-emerald-700 transition-colors duration-200 flex items-center gap-2 shadow-sm" (click)="openAddModal()">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z" clip-rule="evenodd" />
        </svg>
        <span>Thêm mới</span>
      </button>
      <button class="bg-emerald-600 text-white px-4 py-2 text-sm font-medium rounded-lg hover:bg-emerald-700 transition-colors duration-200 flex items-center gap-2 shadow-sm">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M3 17a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zM6.293 6.707a1 1 0 010-1.414l3-3a1 1 0 011.414 0l3 3a1 1 0 01-1.414 1.414L11 5.414V13a1 1 0 11-2 0V5.414L7.707 6.707a1 1 0 01-1.414 0z" clip-rule="evenodd" />
        </svg>
        <span>Import</span>
      </button>
      <button class="bg-emerald-600 text-white px-4 py-2 text-sm font-medium rounded-lg hover:bg-emerald-700 transition-colors duration-200 flex items-center gap-2 shadow-sm">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M3 17a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm3.293-7.707a1 1 0 011.414 0L9 10.586V3a1 1 0 112 0v7.586l1.293-1.293a1 1 0 111.414 1.414l-3 3a1 1 0 01-1.414 0l-3-3a1 1 0 010-1.414z" clip-rule="evenodd" />
        </svg>
        <span>Xuất file</span>
      </button>
    </div>
  </div>

  <!-- PrimeNG Table -->
  <div class="card rounded-lg shadow-md overflow-hidden">
    <p-table [value]="rows" [paginator]="true" [rows]="10" [rowsPerPageOptions]="[5,10,20]">
      <ng-template pTemplate="header">
        <tr>
          <th>Tên phòng/bàn</th>
          <th>Số ghế</th>
          <th>Trạng thái</th>
          <th>Thời gian tạo</th>
          <th>Hành động</th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-table>
        <tr class="hover:bg-emerald-50 transition cursor-pointer">
          <td class="p-2 border font-medium text-emerald-600">{{table.name}}</td>
          <td class="p-2 border">{{table.seats}}</td>
          <td class="p-2 border">{{table.status}}</td>
          <td class="p-2 border">{{table.createdAt | date:'dd/MM/yyyy HH:mm'}}</td>
          <td class="p-2 border">
            <button class="bg-emerald-600 text-white px-3 py-1 rounded-lg text-sm mr-2 hover:bg-emerald-700 transition" (click)="openEditModal(table)">Sửa</button>
            <button class="bg-red-600 text-white px-3 py-1 rounded-lg text-sm hover:bg-red-700 transition" (click)="openDeleteModal(table)">Xóa</button>
          </td>
        </tr>
      </ng-template>
      <ng-template pTemplate="emptymessage">
        <tr>
          <td colspan="5" class="text-center">Không tìm thấy dữ liệu.</td>
        </tr>
      </ng-template>
    </p-table>
  </div>

  <!-- Popup Thêm mới -->
  <div *ngIf="showAddModal" class="fixed inset-0 bg-black bg-opacity-30 flex items-center justify-center z-50">
    <div class="bg-white rounded-lg shadow-lg p-8 w-full max-w-md">
      <div class="text-lg font-bold mb-4">Thêm mới phòng/bàn</div>
      <!-- Form thêm mới -->
      <div class="flex flex-col gap-3 mb-4">
        <input class="border rounded px-3 py-2" placeholder="Tên phòng/bàn" />
        <input class="border rounded px-3 py-2" placeholder="Số ghế" type="number" />
        <select class="border rounded px-3 py-2">
          <option>Trống</option>
          <option>Đang sử dụng</option>
        </select>
      </div>
      <div class="flex gap-2 justify-end">
        <button class="px-4 py-2 rounded bg-gray-200" (click)="closeAddModal()">Hủy</button>
        <button class="px-4 py-2 rounded bg-emerald-600 text-white">Lưu</button>
      </div>
    </div>
  </div>

  <!-- Popup Sửa -->
  <div *ngIf="showEditModal && currentEditTable" class="fixed inset-0 bg-black bg-opacity-30 flex items-center justify-center z-50">
    <div class="bg-white rounded-lg shadow-lg p-8 w-full max-w-md">
      <div class="text-lg font-bold mb-4">Sửa phòng/bàn</div>
      <!-- Form sửa -->
      <div class="flex flex-col gap-3 mb-4">
        <input class="border rounded px-3 py-2" placeholder="Tên phòng/bàn" [(ngModel)]="currentEditTable.name" />
        <input class="border rounded px-3 py-2" placeholder="Số ghế" type="number" [(ngModel)]="currentEditTable.seats" />
        <select class="border rounded px-3 py-2" [(ngModel)]="currentEditTable.status">
          <option>Trống</option>
          <option>Đang sử dụng</option>
        </select>
      </div>
      <div class="flex gap-2 justify-end">
        <button class="px-4 py-2 rounded bg-gray-200" (click)="closeEditModal()">Hủy</button>
        <button class="px-4 py-2 rounded bg-emerald-600 text-white">Lưu</button>
      </div>
    </div>
  </div>

  <!-- Popup Xác nhận xóa -->
  <div *ngIf="showDeleteModal && currentDeleteTable" class="fixed inset-0 bg-black bg-opacity-30 flex items-center justify-center z-50">
    <div class="bg-white rounded-lg shadow-lg p-8 w-full max-w-sm">
      <div class="text-lg font-bold mb-4">Xác nhận xóa</div>
      <div class="mb-6">Bạn có chắc chắn muốn xóa <span class="font-semibold text-emerald-600">{{currentDeleteTable.name}}</span>?</div>
      <div class="flex gap-2 justify-end">
        <button class="px-4 py-2 rounded bg-gray-200" (click)="closeDeleteModal()">Hủy</button>
        <button class="px-4 py-2 rounded bg-red-600 text-white">Xóa</button>
      </div>
    </div>
  </div>
</div>
