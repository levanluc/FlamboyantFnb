<div class="w-64 bg-white p-4 space-y-4 border-r">
  <div>
    <label class="block text-gray-700 font-semibold mb-1">Tìm kiếm</label>
    <input type="text" placeholder="Theo mã, tên hàng" class="w-full border px-3 py-2 rounded" />
  </div>
  <div>
    <label class="block text-gray-700 font-semibold mb-1">Chi nhánh</label>

      <option>Chi nhánh trung tâm</option>
    </select>
  </div>
  <div>
    <label class="block text-gray-700 font-semibold mb-1">Loại thực đơn</label>

      <label class="block"><input type="checkbox" class="mr-2">Đồ ăn</label>

  </div>
  <div>
    <label class="block text-gray-700 font-semibold mb-1">Loại hàng</label>
    <div class="space-y-1">
      <label class="block"><input type="checkbox" class="mr-2">Hàng hóa thường</label>
      <label class="block"><input type="checkbox" class="mr-2">Hàng hóa - sản xuất</label>
      <label class="block"><input type="checkbox" class="mr-2">Chế biến</label>
      <label class="block"><input type="checkbox" class="mr-2">Dịch vụ</label>
      <label class="block"><input type="checkbox" class="mr-2">Combo - Đóng gói</label>
    </div>
  </div>
</div>
