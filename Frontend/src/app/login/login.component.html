<div class="flex items-center justify-center min-h-screen">
  <div class="w-full max-w-md bg-white p-8 rounded-2xl shadow-lg">
    <h2 class="text-2xl font-bold mb-6 text-center text-gray-800">Đăng nhập</h2>

    <form (ngSubmit)="onLogin(loginForm)" #loginForm="ngForm">
      <div *ngIf="loginForm.submitted && loginForm.invalid" class="mb-4">
        <div *ngIf="loginForm.controls['username']?.errors?.['required']" class="text-red-600 text-sm">
          Vui lòng nhập tên đăng nhập.
        </div>
        <div *ngIf="loginForm.controls['username']?.errors?.['email']" class="text-red-600 text-sm">
          Địa chỉ email không hợp lệ.
        </div>
        <div *ngIf="loginForm.controls['password']?.errors?.['required']" class="text-red-600 text-sm">
          Vui lòng nhập mật khẩu.
        </div>
      </div>
      <div class="mb-4">
        <label for="email" class="block text-sm font-medium text-gray-700">Tên đăng nhập</label>
        <input type="text" name="username" ngModel #username="ngModel" required
          placeholder="Nhập tài khoản của bạn"
          class="mt-1 p-3 w-full border border-gray-300 rounded-lg" />
      </div>

      <div class="mb-6">
        <label for="password" class="block text-sm font-medium text-gray-700">Mật khẩu</label>
        <input type="password" name="password" ngModel #password="ngModel" required
          placeholder="Nhập mật khẩu"
          class="mt-1 p-3 w-full border border-gray-300 rounded-lg" />
      </div>

      <div class="flex items-center mb-0">
        <button type="button" class="text-blue-600 hover:underline mr-auto">
          Quên mật khẩu?
        </button>
        <button type="submit" class="bg-blue-600 text-white p-3 rounded-lg hover:bg-blue-700 transition ml-auto">
          Đăng nhập
        </button>
      </div>
    </form>
  </div>
</div>
